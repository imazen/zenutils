# deny.toml — cargo-deny policy template (from heic's 2026 production file).
# `cargo deny check` runs advisories + licenses + bans + sources. Advisory in
# the quality suite; a repo may gate it in CI if it wants a hard floor.

[graph]
all-features = false
# Targets the org actually ships/tests on; trim or extend per repo.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# Record each ignore with a reason, like heic does:
# ignore = [
#     # paste 1.0.15 unmaintained-but-stable via rav1e/rav1d-safe; maintenance
#     # flag, not a CVE. RUSTSEC-2024-0436.
#     "RUSTSEC-2024-0436",
# ]

[licenses]
# Permissive allowlist for transitive deps. AGPL-3.0-only is here for
# first-party imazen crates (gated via `exceptions` per crate below) —
# third-party copyleft deps are NOT allowed by this list's spirit; if a
# third-party dep needs one, discuss before allowing.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    "AGPL-3.0-only",
]
confidence-threshold = 0.93
# First-party crates often dual-license AGPL-3.0-only OR
# LicenseRef-Imazen-Commercial; register the LicenseRef explicitly.
# exceptions = [
#     { allow = ["AGPL-3.0-only", "LicenseRef-Imazen-Commercial"], name = "mycrate" },
# ]

[bans]
multiple-versions = "warn"   # report dup versions; they bloat builds
wildcards = "deny"           # `*` deps are unreviewable
highlight = "all"
deny = [
    { name = "openssl-sys" },            # rustls everywhere
    { name = "ring", version = "<0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git deps must be enumerated — path deps are fine, git URLs need allowing:
# allow-git = [
#     "https://github.com/imazen/zenjxl-decoder",
# ]
