# api-guard caller — place at .github/workflows/api-guard.yml in the
# consumer repo. The reusable workflow lives in imazen/zenutils and posts
# ONE advisory PR comment with the public-API surface diff + policy flags.
#
# For the diff to have something to compare, the repo should commit
# docs/public-api/*.txt snapshots via zenutils-apidoc (see
# quality/README.md). Without them the bot reports a one-line adoption hint.
name: api-guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  api-guard:
    uses: imazen/zenutils/.github/workflows/api-guard.yml@main
    # Pin instead of @main when you want a fixed kit rev:
    # with: { kit-ref: "<sha>" }
